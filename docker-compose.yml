services:
  mongodb:
    image: mongo:7
    container_name: tmf-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: tmf

  redis:
    image: redis:7-alpine
    container_name: tmf-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:

